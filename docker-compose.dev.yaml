services:
  design:
    build:
      context: .
      dockerfile: Dockerfile
    image: slopstack-design:dev
    ports:
      - "${SLOPSTACK_DESIGN_PORT:-8090}:8090"
    environment:
      SLOPSTACK_DESIGN_ADDR: :8090
      SLOPSTACK_DESIGN_DATA: /data
    volumes:
      - design-data-dev:/data
    restart: unless-stopped

volumes:
  design-data-dev:
